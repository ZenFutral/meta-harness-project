name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify no unauthorized runtime packages
        run: |
          python - <<'PY'
          import pkg_resources, sys
          allowed = {"pytest", "google-genai", "rich", "tree-sitter-languages", "networkx"}
          installed = {dist.key for dist in pkg_resources.working_set}
          unauthorized = installed - allowed - {"pip", "setuptools", "wheel"}
          if unauthorized:
              sys.exit(f"Unauthorized packages found: {unauthorized}")
          PY

      - name: Run pytest
        run: |
          pytest
